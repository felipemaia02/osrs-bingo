name: Web CI

# Runs on every PR and push (no path filters): required status checks must always report.
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest) with coverage
        # Thresholds live in vite.config.ts; falling below them fails the job.
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Web coverage", "", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build
        run: npm run build
