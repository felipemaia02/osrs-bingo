# Weekly dependency updates, opened against develop and grouped to keep PRs few.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
